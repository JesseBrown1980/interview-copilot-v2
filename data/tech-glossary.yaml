  # ---- Brazilian-Portuguese idioms operator may use mid-interview ----
  - term: rede neural
    translations: { en-US: neural network, pt-BR: rede neural }

  - term: aprendizado de máquina
    translations: { en-US: machine learning, pt-BR: aprendizado de máquina }

  - term: aprendizado profundo
    translations: { en-US: deep learning, pt-BR: aprendizado profundo }

  - term: nuvem
