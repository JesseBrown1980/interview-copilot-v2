name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-mock pytest-cov pyyaml

      - name: Run unit tests
        run: |
          pytest tests/ \
            --ignore=tests/integration \
            --tb=short \
            -v \
            -m "not slow" \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing
        env:
          ANTHROPIC_API_KEY: ""
          GOOGLE_APPLICATION_CREDENTIALS: ""

      - name: Upload coverage XML
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  integration-tests:
    name: Integration tests (mocked APIs)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-mock pyyaml

      - name: Run integration tests (mocked)
        run: |
          pytest tests/integration/ \
            --tb=short \
            -v
        env:
          ANTHROPIC_API_KEY: ""
          GOOGLE_APPLICATION_CREDENTIALS: ""

  smoke-test:
    name: Smoke test (imports + module init)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Smoke test imports
        run: |
          pytest tests/test_integration_smoke.py -v
