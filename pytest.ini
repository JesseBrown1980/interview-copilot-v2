[pytest]
# Interview-copilot-v2 pytest config — merged by B12-UnitTests, 2026-05-27.
# Originally seeded by sister B-cohort; B12 added strict-markers, asyncio
# autodiscover, timeout, coverage advisory, and per-mark routing.

minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short
    --color=yes

markers =
    unit: pure unit tests with mocked external services (default for per-module tests)
    integration: end-to-end integration tests with mocked external services (B13)
    smoke: minimal init-only / import-only checks
    error_path: failure-mode coverage (API down, device disconnect, MCP unreachable)
    slow: tests expected to take >5s — exclude in fast-pass with `-m "not slow"`

asyncio_mode = auto

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning

log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s

# Coverage gate (when pytest-cov is installed):
#   pytest --cov=src --cov-report=term-missing --cov-fail-under=80
# B12 ships threshold as advisory; CI runner enforces hard 80%.

# Per-test timeout (requires pytest-timeout; soft if plugin missing):
timeout = 60
